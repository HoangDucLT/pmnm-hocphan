<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; line-height: 1.6; }
        h2 { color: #2c3e50; }
        table { border-collapse: collapse; width: 100%; max-width: 600px; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { display: inline-block; padding: 8px 15px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Danh Sách Sinh Viên</h2>

    {% if not students %}
        <p>Chưa có dữ liệu sinh viên trong CSDL.</p>
        <a href="/them-mau" class="btn">Thêm dữ liệu mẫu</a>
    {% else %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>MSSV</th>
                    <th>Họ và Tên</th>
                    <th>GPA</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.mssv }}</td>
                    <td>{{ student.name }}</td>
                    <td>{{ student.gpa }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        <a href="/them-mau" class="btn">Chạy lại route thêm dữ liệu</a>
    {% endif %}

</body>
</html>
