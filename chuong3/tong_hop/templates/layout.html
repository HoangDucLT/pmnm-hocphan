<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        nav { margin-bottom: 20px; background: #f4f4f4; padding: 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
        .filter-bar { margin: 15px 0; }
        .filter-bar a { margin-right: 10px; text-decoration: none; }
        .filter-bar a.active { font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Trang chủ</a>
        <a href="{{ url_for('student_list') }}">Sinh viên</a>
        <a href="{{ url_for('search') }}">Tìm kiếm</a>
    </nav>
    <h1>{% block page_title %}{{ title }}{% endblock %}</h1>
    {% block content %}{% endblock %}
</body>
</html>
