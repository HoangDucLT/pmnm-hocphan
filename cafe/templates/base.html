<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cà phê Sông Hương{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        nav { background-color: #f4f4f4; padding: 10px; border-radius: 5px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        nav a:hover { color: #d35400; }
        footer { margin-top: 30px; padding-top: 10px; border-top: 1px solid #ccc; font-size: 0.9em; color: #666; }
        
        .pagination { margin-top: 15px; }
        .pagination a, .pagination strong { margin-right: 5px; padding: 4px 8px; border: 1px solid #ccc; text-decoration: none; border-radius: 3px; }
        .pagination .active-page { background-color: #d35400; color: white; border-color: #d35400; }       
    </style>
    {% block style %}{% endblock %}
</head>
<body>
    {% include '_navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include '_footer.html' %}
</body>
</html>
