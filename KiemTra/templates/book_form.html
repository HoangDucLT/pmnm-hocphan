{% extends "base.html" %}
{% block title %}{{ 'Sửa' if book else 'Thêm' }} sách{% endblock %}
{% block content %}
<nav aria-label="breadcrumb"><ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('categories') }}">Danh mục</a></li>
    <li class="breadcrumb-item"><a href="{{ url_for('books', cid=category.id) }}">{{ category.name }}</a></li>
    <li class="breadcrumb-item active">{{ 'Sửa sách' if book else 'Thêm sách' }}</li>
</ol></nav>
<h3 class="mb-3">{{ 'Sửa sách' if book else 'Thêm sách vào "' ~ category.name ~ '"' }}</h3>
<form method="post" class="card card-body" style="max-width:600px">
    <div class="mb-3">
        <label class="form-label">Tên sách <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" required
               value="{{ request.form.get('title', book.title if book else '') }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Tác giả <span class="text-danger">*</span></label>
        <input type="text" name="author" class="form-control" required
               value="{{ request.form.get('author', book.author if book else '') }}">
    </div>
    <div class="row">
        <div class="col-md-4 mb-3"><label class="form-label">Giá (VNĐ)</label>
            <input type="number" name="price" min="0" step="1000" class="form-control"
                   value="{{ request.form.get('price', book.price|int if book else 0) }}"></div>
        <div class="col-md-4 mb-3"><label class="form-label">Số lượng</label>
            <input type="number" name="quantity" min="0" class="form-control"
                   value="{{ request.form.get('quantity', book.quantity if book else 0) }}"></div>
        <div class="col-md-4 mb-3"><label class="form-label">Năm xuất bản</label>
            <input type="number" name="year" min="1000" max="2100" class="form-control"
                   value="{{ request.form.get('year', book.year if book and book.year else '') }}"></div>
    </div>
    <div>
        <button class="btn btn-primary">Lưu</button>
        <a href="{{ url_for('books', cid=category.id) }}" class="btn btn-secondary">Hủy</a>
    </div>
</form>
{% endblock %}
